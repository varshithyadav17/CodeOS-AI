name: Verify CodeOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codeos_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: codeos_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U codeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEOS_TEST_POSTGRES_URL: postgresql+asyncpg://codeos_test:isolated_ci_password@localhost:5432/codeos_test
      CODEOS_BROWSER_CHANNEL: chrome
      CODEOS_LIVE_GITHUB_TESTS: '1'
      CODEOS_QA_GRAPH_SCREENSHOT: qa/graph-desktop.png
      CODEOS_QA_GRAPH_MOBILE_SCREENSHOT: qa/graph-mobile.png
      CODEOS_BROWSER_REPORT: qa/browser-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: npm ci --prefix frontend
      - run: python -m ruff check backend --select F
      - run: python -m pytest -q
      - name: Build Render API image
        run: docker build --tag codeos-api:ci ./backend
      - name: Check container runtime
        run: >-
          docker run --rm codeos-api:ci python -c
          "import os, shutil; from app.main import app;
          assert os.getuid() != 0;
          assert shutil.which('git');
          assert '/api/health/live' in app.openapi()['paths'];
          print('PASS non-root container, Git and API imports')"
      - name: Verify free-host startup and concurrent migrations
        run: |
          set -euo pipefail
          trap 'docker rm --force codeos-ci-a codeos-ci-b >/dev/null 2>&1 || true' EXIT
          for spec in a:18000 b:18001; do
            docker run --detach --name "codeos-ci-${spec%%:*}" --network host --memory 512m \
              -e DATABASE_URL="$CODEOS_TEST_POSTGRES_URL" \
              -e ENV=production -e AUTH_COOKIE_SECURE=true -e WORKER_ENABLED=false \
              -e JWT_SECRET=isolated-ci-startup-secret-over-32-characters \
              -e NEO4J_PASSWORD=isolated-ci-no-provider-access \
              -e PORT="${spec#*:}" codeos-api:ci python start.py --migrate
          done
          python - <<'PY'
          import time
          import urllib.request
          deadline = time.monotonic() + 75
          pending = {18000, 18001}
          while pending and time.monotonic() < deadline:
              for port in list(pending):
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health/live', timeout=2) as response:
                          if response.status == 200:
                              pending.remove(port)
                  except OSError:
                      pass
              if pending:
                  time.sleep(1)
          if pending:
              import subprocess
              for name in ('codeos-ci-a', 'codeos-ci-b'):
                  subprocess.run(['docker', 'logs', name], check=False)
              raise SystemExit(f'Container startup failed on ports: {sorted(pending)}')
          print('PASS two 512 MB containers migrated PostgreSQL and started on PORT')
          PY
      - run: npm run lint --prefix frontend
      - run: node --test frontend/src/lib/graphLayout.test.js
      - name: Verify runner Chrome
        run: google-chrome --version
      - run: mkdir -p qa && python scripts/verify_browser.py
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-verification
          path: qa/
          retention-days: 7
      - name: Inspect real public Google sign-in button
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/verify_public_login.py
