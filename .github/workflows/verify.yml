name: Verify CodeOS

on:
  pull_request:
  push:
    branches: [main, codex/deployment-readiness]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codeos_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: codeos_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U codeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEOS_TEST_POSTGRES_URL: postgresql+asyncpg://codeos_test:isolated_ci_password@localhost:5432/codeos_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: npm ci --prefix frontend
      - run: python -m ruff check backend --select F
      - run: python -m pytest -q
      - name: Build Render API image
        run: docker build --tag codeos-api:ci ./backend
      - name: Check container runtime
        run: >-
          docker run --rm codeos-api:ci python -c
          "import os, shutil; from app.main import app;
          assert os.getuid() != 0;
          assert shutil.which('git');
          assert '/api/health/live' in app.openapi()['paths'];
          print('PASS non-root container, Git and API imports')"
      - run: npm run lint --prefix frontend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_browser.py
