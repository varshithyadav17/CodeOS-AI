name: codeos-ai
x-backend-env: &backend-env
  ENV: development
  DATABASE_URL: postgresql+asyncpg://codeos:${POSTGRES_PASSWORD:?Run python scripts/configure.py}@postgres:5432/codeos
  JWT_SECRET: ${JWT_SECRET:?Run python scripts/configure.py}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
  LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-5}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-codeos_gemini_768_v1}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  S3_BUCKET: codeos-archives
  S3_ENDPOINT_URL: http://minio:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-codeos}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run python scripts/configure.py}
  S3_ENCRYPTION: ""
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run python scripts/configure.py}
  QDRANT_URL: http://qdrant:6333
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeos
      POSTGRES_USER: codeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U codeos -d codeos]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run python scripts/configure.py}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j-data:/data]
    ports: ["127.0.0.1:7687:7687", "127.0.0.1:7474:7474"]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
    restart: unless-stopped
  minio:
    build:
      context: ./deployment
      dockerfile: minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codeos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python scripts/configure.py}
    volumes: [archive-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    restart: unless-stopped
  init-archive:
    build: ./backend
    environment: *backend-env
    depends_on: [minio]
    command: python scripts/init_storage.py
    restart: "no"
  migrate:
    build: ./backend
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
    command: alembic upgrade head
    restart: "no"
  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      init-archive: {condition: service_completed_successfully}
      neo4j: {condition: service_started}
      qdrant: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  neo4j-data:
  qdrant-data:
  archive-data:
